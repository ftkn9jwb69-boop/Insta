<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Hérnia femoral — deslizamento pelo canal e encarceramento.
// ?style=real  (atlas realista)   ?style=desenho  (ilustração em nanquim)
const Q = new URLSearchParams(location.search);
const STYLE = Q.get('style') || 'real';
const RL = STYLE === 'real';
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1080, H = 1920, INTRO = 4.4, DUR = 28 + INTRO;
const off = document.createElement('canvas'); off.width = W; off.height = H;
const O = off.getContext('2d');
const SANS = 'Inter, "DejaVu Sans", sans-serif';
const SERIF = '"Bitstream Charter", Caladea, "DejaVu Serif", serif';
const INK = '#2b1d1b';

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth=x=>x*x*(3-2*x);
const lerp=(a,b,k)=>a+(b-a)*k;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,k)=>{const A=hex(a),B=hex(b);return '#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k))).toString(16).padStart(2,'0')).join('');};
const mix3=(a,b,c,s)=>s<=1?mix(a,b,s):mix(b,c,s-1);
const fade=(t,a,b,f=.4)=>Math.min(seg(t,a,a+f),1-seg(t,b-f,b));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};

// ---------- textures ----------
function noiseCanvas(seed,w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const d=g.createImageData(w,h);
  let s=seed;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<w*h;i++){const v=fn(r);d.data[i*4]=v[0];d.data[i*4+1]=v[1];d.data[i*4+2]=v[2];d.data[i*4+3]=v[3];}
  g.putImageData(d,0,0);return c;}
const GRAIN=[1,2,3,4].map(k=>noiseCanvas(k*999,540,960,r=>{const v=r()*255;return [v,v,v,255];}));
const PAPER=(()=>{const c=noiseCanvas(77,540,960,r=>{const v=225+r()*30;return [v,v-4,v-14,255];});
  const g=c.getContext('2d');let s=5;const r=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  g.globalAlpha=.08;g.strokeStyle='#8a6a40';for(let i=0;i<400;i++){const x=r()*540,y=r()*960,a=r()*6.28,l=4+r()*14;g.lineWidth=.6;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  return c;})();

// ---------- geometry helpers ----------
function qpts(a,c,b,n=24){const r=[];for(let i=0;i<=n;i++){const u=i/n,v=1-u;r.push([v*v*a[0]+2*v*u*c[0]+u*u*b[0],v*v*a[1]+2*v*u*c[1]+u*u*b[1]]);}return r;}
function lpts(a,b){const n=Math.max(2,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/14));const r=[];for(let i=0;i<=n;i++)r.push([lerp(a[0],b[0],i/n),lerp(a[1],b[1],i/n)]);return r;}
function dense(cp){ // quadratic-midpoint smoothing of control points
  if(cp.length<3) return lpts(cp[0],cp[1]);
  let r=[cp[0]];let prev=cp[0];
  for(let i=1;i<cp.length-1;i++){const m=i<cp.length-2?[(cp[i][0]+cp[i+1][0])/2,(cp[i][1]+cp[i+1][1])/2]:cp[i+1];
    const n=Math.max(4,Math.ceil(Math.hypot(m[0]-prev[0],m[1]-prev[1])/12));r=r.concat(qpts(prev,cp[i],m,n).slice(1));prev=m;}
  return r;}
let BS=0; // line-boil seed for the hand-drawn style
function J(pts,id,amt=1.5){if(RL)return pts;return pts.map((p,i)=>[p[0]+(rnd(i*3.13+id*17.7+BS*91.1)-.5)*amt*2,p[1]+(rnd(i*7.31+id*13.3+BS*57.7)-.5)*amt*2]);}
function poly(ctx,pts,closed){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(closed)ctx.closePath();}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

// cylindrical structure (vessel, nerve, bowel)
function tube(ctx,cp,w,col,id,isDense){
  const pts=J(isDense?cp:dense(cp),id,1.3);
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  if(RL){
    ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=w*.6;ctx.shadowOffsetX=w*.15;ctx.shadowOffsetY=w*.25;
    poly(ctx,pts);ctx.strokeStyle=col.d;ctx.lineWidth=w;ctx.stroke();ctx.restore();
    const L=[[.8,col.b,.06],[.52,col.l,.14],[.14,col.s,.25]];
    for(const [k,c,o] of L){ctx.save();ctx.translate(-w*o,-w*o);poly(ctx,pts);ctx.strokeStyle=c;ctx.lineWidth=w*k;if(k<.2)ctx.globalAlpha=.75;ctx.stroke();ctx.restore();}
  }else{
    poly(ctx,pts);ctx.strokeStyle=INK;ctx.lineWidth=w+6;ctx.stroke();
    poly(ctx,pts);ctx.strokeStyle=col.sh;ctx.lineWidth=w;ctx.stroke();
    ctx.save();ctx.translate(-w*.15,-w*.15);poly(ctx,pts);ctx.strokeStyle=col.b;ctx.lineWidth=w*.66;ctx.stroke();ctx.restore();
    ctx.save();ctx.translate(-w*.24,-w*.24);poly(ctx,pts);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=Math.max(2,w*.1);ctx.setLineDash([w*1.4,w*.9]);ctx.stroke();ctx.restore();
  }
  ctx.restore();
}
// closed volume (bone, ligament, sac…)
function blob(ctx,pts,col,id,o={}){
  pts=J(pts,id,1.4);
  ctx.save();
  if(RL){
    poly(ctx,pts,true);
    const b=bbox(pts);const g=ctx.createRadialGradient(b.x+b.w*.32,b.y+b.h*.28,2,b.x+b.w*.5,b.y+b.h*.5,Math.max(b.w,b.h)*.75);
    g.addColorStop(0,col.l);g.addColorStop(.55,col.b);g.addColorStop(1,col.d);
    if(o.shadow){ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=24;ctx.shadowOffsetY=10;ctx.fillStyle=g;ctx.fill();ctx.restore();}
    else{ctx.fillStyle=g;ctx.fill();}
    if(o.rim){ctx.strokeStyle=o.rim;ctx.lineWidth=2;ctx.stroke();}
  }else{
    poly(ctx,pts,true);ctx.fillStyle=col.sh;ctx.fill();
    ctx.save();ctx.clip();const k=o.cel||8;ctx.translate(-k,-k);poly(ctx,pts,true);ctx.fillStyle=col.b;ctx.fill();ctx.restore();
    poly(ctx,pts,true);ctx.strokeStyle=INK;ctx.lineWidth=o.lw||3.5;ctx.lineJoin='round';ctx.stroke();
  }
  ctx.restore();
}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1]);}return{x:a,y:b,w:c-a,h:d-b};}

// ---------- palettes ----------
const PAL = RL ? {
  art:{d:'#4a070d',b:'#a51c26',l:'#d9474c',s:'#ffd0d0'},
  vein:{d:'#0b1a40',b:'#244896',l:'#5079cc',s:'#d8e4ff'},
  nerve:{d:'#6a5414',b:'#c9a52f',l:'#ecd170',s:'#fffbe0'},
  bowelBg:{d:'#5c2427',b:'#9c4e4e',l:'#c27670',s:'#f0c8c0'},
  bone:{d:'#9b8762',b:'#d9cba6',l:'#f6eedb'},
  lig:{d:'#a89a80',b:'#e7dfcd',l:'#fffaf0'},
  b0:['#7e3036','#cf7c73','#efb1a5','#fff0ea'], b1:['#4e0b1a','#9c2238','#cc4658','#ffb0b8'], b2:['#12050d','#33122a','#56264a','#9a6a8c'],
} : {
  art:{sh:'#c23a3e',b:'#ec6a62'}, vein:{sh:'#33609e',b:'#6b9ade'}, nerve:{sh:'#d3a92a',b:'#f7da5f'},
  bowelBg:{sh:'#d99a8e',b:'#f3c3b6'},
  bone:{sh:'#dcc9a0',b:'#f7ecd2'}, lig:{sh:'#e3d8c0',b:'#fffaf0'},
  b0:['#d98a80','#f8b8ac'], b1:['#ad2c43','#da566c'], b2:['#3c1530','#6a2c56'],
};

// ---------- anatomy (world coords) ----------
const ASIS=[140,640], PT=[900,880];
const LIG=qpts(ASIS,[520,ASIS[1]+(520-140)*240/760+42],PT,60);
const ligY=x=>{for(let i=1;i<LIG.length;i++){if(LIG[i][0]>=x){const a=LIG[i-1],b=LIG[i];return lerp(a[1],b[1],(x-a[0])/(b[0]-a[0]));}}return PT[1];};
const CANAL=[616,666]; // compartimento medial: ~largura da veia
const RING=[641,ligY(641)+12];
const SAPH=[628,1110];

// ---------- camera ----------
const CAM=[[0,1,540,950],[2.7,1,540,950],[4.1,1.55,640,905],[5.6,1.58,640,905],[8.8,1.34,640,915],[10.4,1.34,640,915],[13.2,1.3,630,985],[14.6,1.3,630,985],[16.2,1.4,640,962],[21.8,1.45,640,968],[23.8,1,540,950],[28,1,540,950]];
let CS=1,CF=[540,950];
function camera(t){for(let i=1;i<CAM.length;i++){if(t<=CAM[i][0]){const a=CAM[i-1],b=CAM[i];const k=smooth(seg(t,a[0],b[0]));CS=lerp(a[1],b[1],k);CF=[lerp(a[2],b[2],k),lerp(a[3],b[3],k)];return;}}const l=CAM[CAM.length-1];CS=l[1];CF=[l[2],l[3]];}
const camT=ctx=>ctx.setTransform(CS,0,0,CS,540-CF[0]*CS,950-CF[1]*CS);
const S=(x,y)=>[(x-CF[0])*CS+540,(y-CF[1])*CS+950];

// ---------- hernia state ----------
function hernia(t){
  const p=ease(seg(t,5.8,14.4));
  const inc=smooth(seg(t,14.6,19.2)), str=smooth(seg(t,19.2,22.2));
  const a=clamp(p/.55), b=clamp((p-.55)/.45);
  let cx,cy,r;
  if(p<=.55){cx=RING[0];cy=lerp(728,1092,ease(a));r=lerp(14,26,a);}
  else{const e=ease(b);cx=lerp(RING[0],628,e);cy=lerp(1092,1002,e);r=lerp(26,138,e);}
  r+=inc*16+str*6;
  return{p,a,b,cx,cy,r,neck:lerp(23,17,inc),s:inc+str,inc,str};
}
function sacOutline(h){
  const top=RING[1]-34,n=h.neck,R=h.r+14,rx=R*1.04,ry=R*.94;
  const a0=Math.PI+.62,a1=-.62;
  const L=[h.cx+rx*Math.cos(a0),h.cy+ry*Math.sin(a0)],Rt=[h.cx+rx*Math.cos(a1),h.cy+ry*Math.sin(a1)];
  let pts=qpts([RING[0]-n,top],[RING[0]-n,lerp(top,L[1],.75)],L,16);
  const N=40;
  // angles a0 (≈216°) → going through 90° (bottom) → a1 (≈-36°): decreasing
  const arcPts=[];for(let i=1;i<N;i++){const th=a0-(a0-a1)*(i/N);arcPts.push([h.cx+rx*Math.cos(th),h.cy+ry*Math.sin(th)]);}
  pts=pts.concat(arcPts);
  pts=pts.concat(qpts(Rt,[RING[0]+n,lerp(top,Rt[1],.75)],[RING[0]+n,top],16));
  return pts;
}
function bowelPath(h){
  const top=RING[1]-34,off=Math.min(h.neck*.45,12);
  const rr=Math.max(h.r*.58,off+4);
  const d=Math.asin(clamp(off/rr,0,.95));
  let p=dense([[430,648],[600,650],[RING[0]-off,top-40],[RING[0]-off,top]]);
  const entryY=h.cy-rr*Math.cos(d);
  p=p.concat(lpts([RING[0]-off,top],[h.cx-off,entryY]).slice(1));
  const a0=-Math.PI/2-d, a1=-Math.PI/2+d-2*Math.PI, N=70, loop=[];
  for(let i=0;i<=N;i++){const th=lerp(a0,a1,i/N);const w=1+.09*Math.sin(3*th+.8)*clamp((h.r-40)/60);
    loop.push([h.cx+rr*w*Math.cos(th)*1.04,h.cy+rr*w*Math.sin(th)*.94]);}
  p=p.concat(loop);
  p=p.concat(lpts([h.cx+off,entryY],[RING[0]+off,top]).slice(1));
  p=p.concat(dense([[RING[0]+off,top],[RING[0]+off,top-40],[760,650],[920,640]]).slice(1));
  return{p,loop,rr,off};
}
function bowelCol(s){const B=PAL;const k=i=>mix3(B.b0[i],B.b1[i],B.b2[i],s);return RL?{d:k(0),b:k(1),l:k(2),s:k(3)}:{sh:k(0),b:k(1)};}

function drawHernia(ctx,h,t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,W,H);
  if(h.p<=.001) return;
  camT(ctx);
  const sacA=clamp(h.p*6), sac=sacOutline(h);
  // sac membrane
  ctx.save();ctx.globalAlpha=sacA;
  const fluid=h.inc;
  if(RL){
    poly(ctx,sac,true);const g=ctx.createRadialGradient(h.cx-h.r*.3,h.cy-h.r*.3,5,h.cx,h.cy,h.r+20);
    g.addColorStop(0,'rgba(215,225,245,.30)');g.addColorStop(1,'rgba(150,165,200,.42)');
    ctx.fillStyle=g;ctx.fill();
    if(fluid>0){ctx.globalAlpha=sacA*fluid*.55;ctx.fillStyle=mix('#c9a24a','#6a1424',h.str);ctx.fill();}
  }else{
    poly(ctx,J(sac,301,1.4),true);ctx.fillStyle=mix(mix('#dfe9f6','#f3e3b0',fluid*.7),'#d9a0a8',h.str);ctx.fill();
  }
  ctx.restore();
  // mesentery + bowel
  const B=bowelPath(h);
  ctx.save();ctx.globalAlpha=sacA;
  if(h.r>38){
    const mes=[[RING[0]-B.off*.6,RING[1]-30]].concat(B.loop.filter((_,i)=>i%2==0).map(q=>[lerp(h.cx,q[0],.86),lerp(h.cy,q[1],.86)])).concat([[RING[0]+B.off*.6,RING[1]-30]]);
    const ma=clamp((h.r-38)/40);ctx.globalAlpha=sacA*ma;
    if(RL){poly(ctx,mes,true);const g=ctx.createRadialGradient(h.cx-20,h.cy-30,5,h.cx,h.cy,h.r);g.addColorStop(0,mix('#f2d78a','#7a3a40',h.s*.5));g.addColorStop(1,mix('#b88f3e','#3a1420',h.s*.5));ctx.fillStyle=g;ctx.fill();
      // fat lobules
      for(let i=0;i<14;i++){const a=rnd(i*5.1)*6.28,rad=rnd(i*2.7)*B.rr*.6;ctx.beginPath();ctx.arc(h.cx+Math.cos(a)*rad,h.cy+Math.sin(a)*rad,6+rnd(i)*7,0,7);ctx.fillStyle=`rgba(255,240,190,${.18*(1-h.s*.4)})`;ctx.fill();}
    }else{blob(ctx,mes,{sh:mix('#ecc66a','#a2607a',h.s*.5),b:mix('#fbe39a','#c7849a',h.s*.5)},401,{cel:6,lw:2.5});}
    // vascular arcades
    const vcol=h.inc>.05?mix('#c8303e','#4a5fb0',h.inc):(RL?'#c8303e':'#c23a3e');
    ctx.strokeStyle=vcol;ctx.lineWidth=RL?3:3.2;ctx.lineCap='round';ctx.globalAlpha=sacA*ma*(1-h.str*.8);
    for(let k=4;k<B.loop.length-4;k+=7){const q=B.loop[k];const m=[lerp(h.cx,q[0],.82),lerp(h.cy,q[1],.82)];
      const pp=J(qpts([RING[0],RING[1]-20],[lerp(RING[0],m[0],.5)+(k%2?14:-14),lerp(RING[1],m[1],.6)],m,10),500+k,1);poly(ctx,pp);ctx.stroke();}
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=sacA>0?1:0;
  const bw=lerp(17,24,clamp(h.b*2))+h.inc*10+h.str*2;
  tube(ctx,B.p,bw,bowelCol(h.s),600,true);
  // petechiae / necrotic patches
  if(h.inc>.3){ctx.globalAlpha=clamp((h.inc-.3)*1.5)*(RL?.7:.9);ctx.fillStyle=h.str>.4?'#0d0409':'#6a0a1c';
    for(let i=0;i<B.loop.length;i+=5){const q=B.loop[i];const sz=bw*(.08+.12*rnd(i)+h.str*.18);ctx.beginPath();ctx.ellipse(q[0]+(rnd(i+3)-.5)*bw*.4,q[1]+(rnd(i+9)-.5)*bw*.4,sz,sz*.7,i,0,7);ctx.fill();}}
  ctx.restore();
  // sac rim on top (glossy membrane / ink)
  ctx.save();ctx.globalAlpha=sacA;
  if(RL){poly(ctx,sac,true);ctx.strokeStyle=mix('#d8e2f2','#ff6a78',h.inc*.6);ctx.lineWidth=3;ctx.stroke();
    ctx.save();poly(ctx,sac,true);ctx.clip();ctx.globalAlpha=sacA*.35;const g=ctx.createLinearGradient(h.cx-h.r,h.cy-h.r,h.cx,h.cy);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(.4,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(h.cx-h.r-30,h.cy-h.r-30,2*h.r+60,2*h.r+60);ctx.restore();
  }else{poly(ctx,J(sac,301,1.4),true);ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.stroke();
    // membrane hatch on lower-right
    ctx.save();poly(ctx,J(sac,301,1.4),true);ctx.clip();ctx.strokeStyle='rgba(43,29,27,.28)';ctx.lineWidth=1.6;
    for(let i=-40;i<30;i++){const x=h.cx+i*9;ctx.beginPath();ctx.moveTo(x,h.cy+h.r*.35);ctx.lineTo(x+h.r*.6,h.cy+h.r*1.35);ctx.stroke();}ctx.restore();}
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
}

// ---------- scene layers ----------
function panelBase(){
  if(RL){
    const pg=X.createRadialGradient(560,820,80,560,950,760);pg.addColorStop(0,'#3a1a1e');pg.addColorStop(1,'#120709');X.fillStyle=pg;X.fillRect(-500,0,2200,2400);
  }else{X.fillStyle='#f4e7d4';X.fillRect(-500,0,2200,2400);}
}
function abdomen(){
  // region above the ligament (preperitoneal / peritoneal cavity)
  X.save();poly(X,[[-200,300],[1300,300],[1300,ligY(1040)],[1040,ligY(1040)]].concat(LIG.slice().reverse()).concat([[ASIS[0],ASIS[1]],[-200,ASIS[1]]]),true);
  X.fillStyle=RL?'rgba(70,18,30,.75)':'rgba(240,196,190,.75)';X.fill();X.clip();
  if(RL)X.filter='blur(1.6px)';
  X.globalAlpha=RL?.55:.7;
  [[[200,560],[300,500],[400,580],[500,520],[560,575]],[[760,520],[880,470],[990,555],[900,615]],[[240,650],[330,600],[410,655]],[[600,520],[680,470],[740,510]]].forEach((l,i)=>tube(X,l,32,PAL.bowelBg,20+i));
  X.filter='none';X.restore();
}
function muscles(){
  const m=(poly0,slope,col,id)=>{X.save();poly(X,J(poly0,id,1.2),true);
    if(RL){const g=X.createLinearGradient(poly0[0][0],poly0[0][1],poly0[2][0],poly0[2][1]);g.addColorStop(0,col[0]);g.addColorStop(1,col[1]);X.fillStyle=g;X.fill();X.clip();
      X.strokeStyle='rgba(255,160,150,.10)';X.lineWidth=3;for(let i=-800;i<1600;i+=11){X.beginPath();X.moveTo(i,700);X.lineTo(i+slope*800,1500);X.stroke();}
      X.strokeStyle='rgba(0,0,0,.22)';X.lineWidth=1.5;for(let i=-800;i<1600;i+=11){X.beginPath();X.moveTo(i+5,700);X.lineTo(i+5+slope*800,1500);X.stroke();}}
    else{X.fillStyle=col[2];X.fill();X.clip();X.strokeStyle='rgba(43,29,27,.35)';X.lineWidth=1.8;for(let i=-800;i<1600;i+=22){X.beginPath();X.moveTo(i,700);X.lineTo(i+slope*800,1500);X.stroke();}
      X.restore();X.save();poly(X,J(poly0,id,1.2),true);X.strokeStyle=INK;X.lineWidth=3;X.stroke();}
    X.restore();};
  m([[60,ligY(140)+20],[420,ligY(420)],[400,1500],[40,1500]],-.25,['#7a2a2a','#4a1416','#e0998a'],31); // iliopsoas
  m([[600,960],[1060,930],[1000,1500],[560,1500]],.35,['#6a2224','#3e1012','#d98d80'],32); // pectineus / adductors
}
function bone(){
  const p=dense([[450,925],[600,898],[800,892],[900,886],[1060,850],[1060,975],[900,972],[700,982],[455,980],[450,925]]);
  blob(X,p,PAL.bone,40,{cel:7});
  // pectineal (Cooper's) ligament

function wrap(ctx,txt,maxW){const ws=txt.split(' '),L=[];let c='';for(const w of ws){const s=c?c+' '+w:w;if(ctx.measureText(s).width>maxW&&c){L.push(c);c=w;}else c=s;}if(c)L.push(c);return L;}

  const bold=[];let idx=0,on=false;for(let i=0;i<txt.length;i++){if(txt.startsWith('**',i)){on=!on;i++;continue;}bold[idx++]=on;}
  let k=0;lines.forEach((ln,li)=>{let cx=x;for(const ch of ln){const b=bold[k];X.font=fn(b);X.fillStyle=b?(RL?'#ffd36b':'#9a3008'):(RL?'#eef1fa':INK);X.fillText(ch,cx,y+li*lh);cx+=X.measureText(ch).width;k++;}k++;});
}

function introOverlay(t){
  const reveal=seg(t,INTRO-1.1,INTRO+.7); if(reveal>=1) return;
